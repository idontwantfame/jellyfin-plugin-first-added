name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release tag matches assembly version
        run: |
          version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("Jellyfin.Plugin.FirstAdded/Jellyfin.Plugin.FirstAdded.csproj").findtext(".//AssemblyVersion"))')
          test "$GITHUB_REF_NAME" = "v$version"
      - run: dotnet build Jellyfin.Plugin.FirstAdded.Tests -c Release --warnaserror
      - run: dotnet run --project Jellyfin.Plugin.FirstAdded.Tests -c Release --no-build
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/package.py --repository "$GITHUB_REPOSITORY"
      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/*.zip.sha256 dist/*.zip.md5 \
            dist/manifest.json dist/metadata.json \
            --verify-tag --title "First Added ${GITHUB_REF_NAME#v}" --notes-from-tag
