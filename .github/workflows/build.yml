name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build Jellyfin.Plugin.FirstAdded.Tests -c Release --warnaserror
      - run: dotnet run --project Jellyfin.Plugin.FirstAdded.Tests -c Release --no-build
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: first-added
          path: dist/*
          if-no-files-found: error
